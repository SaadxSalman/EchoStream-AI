[package]
name = "echostream-agent"
version = "0.1.0"
edition = "2021"
description = "Real-Time Voice-Interactive RAG Agent with Sub-Second Latency and Streaming KV Caching"

[[bin]]
name = "echostream-server"
path = "src/main.rs"

[[bin]]
name = "echostream-ingest"
path = "src/bin/ingest.rs"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
