name: echostream

services:
  # ---------------------------------------------------------------- vector DB
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------- vLLM
  vllm:
    image: vllm/vllm-openai:v0.6.6
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --port 8000
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-model-len 8192
      --gpu-memory-utilization 0.90
    # LMCache: offload + reuse KV blocks across requests/instances.
    # Remove the kv-transfer-config below if you only want in-engine
    # automatic prefix caching.
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_KV_CACHE_TRANSFER_CONFIG={"kv_connector":"LMCacheConnectorV1","kv_role":"kv_producer_and_consumer"}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ------------------------------------------------------- Rust app + web UI
  echostream:
    build: ./server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override hosts for the in-compose network.
      QDRANT_URL: http://qdrant:6333
      VLLM_BASE_URL: http://vllm:8000/v1
      WEB_DIR: /web
    volumes:
      - ./web:/web:ro
    depends_on:
      qdrant:
        condition: service_healthy
      vllm:
        condition: service_started
    restart: unless-stopped

volumes:
  qdrant_data:
  hf_cache:
